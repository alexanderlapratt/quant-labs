[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlabs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["polars", "pandas", "numpy", "scipy", "pyarrow", "matplotlib", "yfinance", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]